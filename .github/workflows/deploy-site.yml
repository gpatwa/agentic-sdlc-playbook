# Deploys the public site to Cloudflare Pages.
#
# Driven by an agent, approved by a human. No dashboard clicking.
#
# Setup takes exactly one human-supplied value, once, ever: a Cloudflare API
# token. Creating a credential needs an already-authenticated caller, so the
# first one has to come from a person — and HUMAN_APPROVAL_RULES.md forbids an
# agent handling tokens regardless. scripts/setup-deploy.sh discovers
# everything else (account id, zone id, repo, reviewer) from that token.
#
# The approval below is not a gap in the automation; it is the requirement.
# Promoting to a live domain is a rule-3 external-effect change, and the
# `production` environment is that rule expressed in CI — the job pauses, a
# named human approves, GitHub records who and when. That record is the same
# evidence this product exists to produce, applied to itself.
#
# Everything else — validation, deploy, live verification — runs unattended.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml", "scripts/check-site.mjs"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is being run (recorded in the run log)"
        required: false
        default: "manual dispatch"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Gate first. A deploy that fails validation should never reach the human —
  # asking someone to approve a broken build wastes the one scarce resource
  # in the loop.
  verify:
    name: Site gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Structure, themes, anchors, origins
        run: node scripts/check-site.mjs site

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    # The human gate. Configure required reviewers on this environment once
    # (scripts/setup-deploy.sh does it via the API) and every deploy from then
    # on pauses here for a named approval that GitHub records.
    environment:
      name: production
      url: https://aveto.dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=aveto --branch=main

      # Post-deploy verification, in the same spirit as
      # agents/production-verification.md: a deploy is not "done" because the
      # command exited 0. Check the live origin actually serves the page.
      - name: Verify live
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/live.html -w "%{http_code}" -m 15 https://aveto.dev/ || echo 000)
            if [ "$code" = "200" ] && grep -q "accountable autonomy" /tmp/live.html; then
              echo "live check passed (HTTP $code, expected content present)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "::error::site did not serve expected content after deploy"
          exit 1
